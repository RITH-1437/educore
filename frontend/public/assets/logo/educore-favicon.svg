<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EduCore">
  <!-- Small-size brand mark: mortarboard over an "E", Academic Blue tile,
       teal tassel. Flat shapes on a 64px grid so it stays crisp at 16–32px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!-- mortarboard -->
  <path d="M32 9 55 19.5 32 30 9 19.5Z" fill="#FFFFFF"/>
  <!-- tassel -->
  <path d="M49 22v10" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="49" cy="35" r="3.5" fill="#5EEAD4"/>
  <!-- E -->
  <path d="M18 31.5h22a3 3 0 0 1 0 6H24v3h12a3 3 0 0 1 0 6H24v3h16a3 3 0 0 1 0 6H18a3 3 0 0 1-3-3v-18a3 3 0 0 1 3-3Z" fill="#FFFFFF"/>
</svg>
