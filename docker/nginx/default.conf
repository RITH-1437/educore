server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Health check endpoint for the nginx container itself.
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    # Laravel API routes and public storage -> PHP-FPM (backend container).
    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Brand/static assets published by the frontend (`frontend/public/assets`).
    # Single canonical copy; mounted read-only at /srv/educcore-assets.
    location ^~ /assets/ {
        alias /srv/educcore-assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Inertia app: regular pages are rendered by Laravel (PHP-FPM). Existing
    # public files (e.g. /build/* built assets, /storage/* symlink) are served
    # statically; anything else falls through to index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}