name: educore

networks:
  educore-network:
    driver: bridge

volumes:
  pgdata:
  pgadmin-data:
  redisdata:
  minio-data:
  backend-vendor:
  frontend-node-modules:

services:
  # ------------------------------------------------------------------ nginx
  nginx:
    image: nginx:alpine
    container_name: educore-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - educore-network

  # ----------------------------------------------------------------- backend
  backend:
    build:
      context: ./docker/php
    image: educore/backend:dev
    container_name: educore-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DB_HOST: postgres
      DB_PORT: "${POSTGRES_PORT:-5432}"
      DB_DATABASE: "${POSTGRES_DB:-educore}"
      DB_USERNAME: "${POSTGRES_USER:-educore}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-educore}"
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r 'try {
          new PDO("pgsql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE"),
          getenv("DB_USERNAME"), getenv("DB_PASSWORD"));
          } catch (Throwable $$e) { exit(1); }' && exit 0 || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - educore-network

  # --------------------------------------------------------------- frontend
  frontend:
    build:
      context: ./docker/frontend
    image: educore/frontend:dev
    container_name: educore-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://nginx:80}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - educore-network

  # -------------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    container_name: educore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-educore}
      POSTGRES_USER: ${POSTGRES_USER:-educore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educore}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - educore-network

  # --------------------------------------------------------------- pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: educore-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@educore.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-educore_admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c '(exec 3<>/dev/tcp/127.0.0.1/80) 2>/dev/null && exit 0 || exit 1'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - educore-network

  # ----------------------------------------------------------------- redis
  redis:
    image: redis:7-alpine
    container_name: educore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - educore-network

  # ----------------------------------------------------------------- minio
  minio:
    image: coollabsio/minio:latest
    container_name: educore-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-educore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-educore_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c '(exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null && exit 0 || exit 1'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - educore-network

  # ------------------------------------------------- minio bucket init (one-shot)
  minio-init:
    image: amazon/aws-cli:latest
    container_name: educore-minio-init
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-educore}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-educore_minio_secret}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MINIO_ENDPOINT: http://minio:9000
      AWS_BUCKET: ${AWS_BUCKET:-educore}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until aws --endpoint-url "$$MINIO_ENDPOINT" s3 ls >/dev/null 2>&1; do
          echo "waiting for minio..."; sleep 2
        done
        aws --endpoint-url "$$MINIO_ENDPOINT" s3 mb --region "$$AWS_DEFAULT_REGION" "s3://$$AWS_BUCKET" || echo "Bucket already exists"
        echo "MinIO bucket '$$AWS_BUCKET' is ready."
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - educore-network